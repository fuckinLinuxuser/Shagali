</style></head> <body data-astro-cid-2zp6q64z> <div class="container" data-astro-cid-2zp6q64z> <!-- Логин --> <div id="loginScreen" data-astro-cid-2zp6q64z> <h1 data-astro-cid-2zp6q64z>Админ-панель</h1> <div style="max-width:420px; margin:100px auto;" data-astro-cid-2zp6q64z> <input type="password" id="passwordInput" placeholder="Введите пароль" data-astro-cid-2zp6q64z> <button id="loginBtn" class="btn-primary" data-astro-cid-2zp6q64z>Войти</button> </div> </div> <!-- Админка --> <div id="adminPanel" class="hidden" data-astro-cid-2zp6q64z> <h1 data-astro-cid-2zp6q64z>Управление постами</h1> <h2 id="formTitle" data-astro-cid-2zp6q64z>Новый пост</h2> <form id="postForm" data-astro-cid-2zp6q64z> <input type="hidden" id="postId" data-astro-cid-2zp6q64z> <input type="text" id="title" placeholder="Название поста" required data-astro-cid-2zp6q64z> <input type="text" id="date" placeholder="Дата (например: Март 2026)" required data-astro-cid-2zp6q64z> <label data-astro-cid-2zp6q64z>Фото обложки <span class="required" data-astro-cid-2zp6q64z>*</span></label> <input type="file" id="coverImage" accept="image/*" required data-astro-cid-2zp6q64z> <label data-astro-cid-2zp6q64z>Короткий текст <span class="required" data-astro-cid-2zp6q64z>*</span></label> <textarea id="shortText" rows="3" required data-astro-cid-2zp6q64z></textarea> <label data-astro-cid-2zp6q64z>Полный текст <span class="required" data-astro-cid-2zp6q64z>*</span></label> <textarea id="fullText" rows="9" required data-astro-cid-2zp6q64z></textarea> <label data-astro-cid-2zp6q64z>Основное медиа (видео/фото) <span class="required" data-astro-cid-2zp6q64z>*</span></label> <input type="file" id="mainMedia" accept="image/*,video/*" required data-astro-cid-2zp6q64z> <button type="submit" class="btn-primary" id="submitBtn" data-astro-cid-2zp6q64z>Опубликовать пост</button> </form> <div id="status" data-astro-cid-2zp6q64z></div> <h2 data-astro-cid-2zp6q64z>Существующие посты</h2> <table id="postsTable" data-astro-cid-2zp6q64z> <thead data-astro-cid-2zp6q64z> <tr data-astro-cid-2zp6q64z> <th data-astro-cid-2zp6q64z>Дата</th> <th data-astro-cid-2zp6q64z>Название</th> <th style="width: 220px;" data-astro-cid-2zp6q64z>Действия</th> </tr> </thead> <tbody data-astro-cid-2zp6q64z></tbody> </table> </div> </div> <script>(function(){const ADMIN_PASSWORD = "1111";

       async function loadPosts() {
    const res = await fetch('/api.php'); // Меняем путь
    const posts = await res.json();
    const tbody = document.querySelector('#postsTable tbody');
    tbody.innerHTML = '';
    posts.forEach(post => {
        const row = document.createElement('tr');
        row.innerHTML = `
        <td>${post.date}</td>
        <td>${post.title}</td>
        <td>
        <button class="btn btn-edit" onclick="editPost(${post.id})">✏️ Редактировать</button>
        <button class="btn btn-delete" onclick="deletePost(${post.id})">🗑️ Удалить</button>
        </td>
        `;
        tbody.appendChild(row);
    });
}

window.editPost = async (id) => {
    const res = await fetch(`/api.php?id=${id}`); // Меняем путь
    const post = await res.json();
    currentEditId = post.id;
    document.getElementById('formTitle').textContent = 'Редактирование поста';
    document.getElementById('title').value = post.title;
    document.getElementById('date').value = post.date;
    document.getElementById('shortText').value = post.shortText;
    document.getElementById('fullText').value = post.fullText;
    document.getElementById('coverImage').required = false;
    document.getElementById('mainMedia').required = false;
    document.getElementById('submitBtn').textContent = 'Сохранить изменения';
};

window.deletePost = async (id) => {
    if (!confirm('Удалить этот пост безвозвратно?')) return;
    const res = await fetch(`/api.php?id=${id}`, { method: 'DELETE' }); // Меняем путь
    if (res.ok) {
        loadPosts();
    } else {
        alert('Ошибка при удалении');
    }
};

// Внутри обработчика отправки формы ('submit') замените блок определения url и method:
document.getElementById('postForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    status.textContent = 'Сохранение...';
    
    const formData = new FormData();
    formData.append('title', document.getElementById('title').value);
    formData.append('date', document.getElementById('date').value);
    formData.append('shortText', document.getElementById('shortText').value);
    formData.append('fullText', document.getElementById('fullText').value);
    
    const coverFile = document.getElementById('coverImage').files[0];
    const mainFile = document.getElementById('mainMedia').files[0];
    if (coverFile) formData.append('coverImage', coverFile);
    if (mainFile) formData.append('mainMedia', mainFile);

    const isEdit = !!currentEditId;
    // PHP не умеет из коробки читать FormData через PUT, поэтому шлем POST с флагом в query
    const url = isEdit ? `/api.php?id=${currentEditId}&_method=PUT` : '/api.php';
    const method = 'POST'; 

    try {
        const res = await fetch(url, { method, body: formData });
        if (res.ok) {
            status.style.color = '#4ade80';
            status.textContent = isEdit ? '✅ Изменения сохранены!' : '✅ Пост успешно опубликован!';
            document.getElementById('postForm').reset();
            currentEditId = null;
            document.getElementById('formTitle').textContent = 'Новый пост';
            document.getElementById('submitBtn').textContent = 'Опубликовать пост';
            document.getElementById('coverImage').required = true;
            document.getElementById('mainMedia').required = true;
            loadPosts();
        }
    } catch (err) {
        status.style.color = '#f87171';
        status.textContent = '❌ Ошибка при сохранении';
    }
});

    })();</script> </body> </html>
