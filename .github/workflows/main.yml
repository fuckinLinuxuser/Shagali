name: Deploy to Reg.ru

on:
  push:
    branches: [ main ]  # Или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Для Astro обычно 18+

      - name: Install dependencies
        run: npm ci  # Или yarn install

      - name: Build Astro
        run: npm run build  # Создаст /dist

      - name: Deploy via SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete  # Синхронизирует, удаляет лишнее
          path: dist/  # Папка для деплоя
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_path: /www/shagali.ru/
