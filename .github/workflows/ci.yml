name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: astro/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - run: npm ci
      - run: npm run lint:php
      - run: npm test
      - run: npm run build

      - name: В dist нет секретов админки
        run: |
          if grep -rIEn "ADMIN_TOKEN|X-Admin-Token|c8f2b6e4" dist; then
            echo "::error::В dist найден токен/пароль админки"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
