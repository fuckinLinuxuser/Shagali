name: Deploy to Reg.ru

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: astro/package-lock.json   # ← важно!

      - name: Install dependencies
        working-directory: astro                         # ← здесь!
        run: npm ci

      - name: Build Astro
        working-directory: astro                         # ← здесь!
        run: npm run build

      - name: Deploy via SSH (rsync)
        uses: burnett01/rsync-deployments@v8   # или @8.0.4 для конкретной
        with:
          switches: -avzr --delete
          path: astro/dist/                              # ← astro/dist/ а не просто dist/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_path: /www/shagali.ru/   # подставь свой реальный путь