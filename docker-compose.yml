# Локальный стенд: статика из astro/dist + PHP 8.3 (как на reg.ru) + MySQL 8.
# Запуск: (cd astro && npm run build:stand) && sh docker/init-config.sh && docker compose up -d  → http://localhost:8080
# Стенд отдаёт astro/dist-stand — сборку с фикстурами (tests/fixtures/content). Другая папка — STAND_DIST=dist.
# dist копируется в контейнер при старте, поэтому запись api.php (posts.json, загрузки) не портит astro/dist.
services:
  web:
    build:
      context: docker
      dockerfile: web.Dockerfile
    ports:
      - "8080:80"
    environment:
      SHAGALI_CONFIG: /run/shagali/config.php
    volumes:
      - ./astro/${STAND_DIST:-dist-stand}:/dist-src:ro
      - ./docker/config.local.php:/run/shagali/config.php:ro
      - ./sql:/migrations:ro
    command: >
      bash -c "cp -a /dist-src/. /var/www/html/ && chown -R www-data:www-data /var/www/html && php /migrations/migrate.php /var/www/html/api && apache2-foreground"
    depends_on:
      - db
      - mailpit

  # Почта стенда: ловит все письма (регистрация, сброс пароля). Интерфейс и API — http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  db:
    image: mysql:8
    environment:
      # Тестовые значения только для локального стенда, не для прода.
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: shagali
    ports:
      - "3307:3306"
